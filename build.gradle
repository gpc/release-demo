buildscript {
    ext {
        grailsVersion = project.grailsVersion
    }
    repositories {
        mavenCentral()
        maven { url "https://repo.grails.org/grails/core/" }
        maven { url "https://repo.grails.org/grails/restricted" }
    }
    dependencies {
        classpath platform("org.apache.grails:grails-bom:$grailsVersion")
        classpath "org.apache.grails:grails-gradle-plugins"
    }
}

plugins {
    id 'groovy'
    id 'war'
    id 'idea'
    id 'application'
    id 'java-library'
    id 'org.asciidoctor.jvm.convert'
}

apply plugin: 'org.apache.grails.gradle.grails-plugin'
apply plugin: 'org.apache.grails.gradle.grails-publish'

repositories {
    mavenCentral()
    maven { url "https://repo.grails.org/grails/core/" }
    maven { url "https://repo.grails.org/grails/restricted" }
}

group 'io.github.gpc'

configurations {
    all {
    }
}

dependencies {
    compileOnly platform("org.apache.grails:grails-bom:$grailsVersion")
    compileOnly 'org.apache.grails:grails-dependencies-starter-web'
    
    console("org.apache.grails:grails-console")
    runtimeOnly("com.h2database:h2")
    runtimeOnly("org.apache.tomcat:tomcat-jdbc")
    
    testImplementation platform("org.apache.grails:grails-bom:$grailsVersion")
    testImplementation("org.apache.grails:grails-testing-support-web")
    testImplementation("org.spockframework:spock-core")

}

application {
    mainClass.set("release.demo.Application")
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

grailsPublish {
    githubSlug = 'gpc/release-demo'
    license {
        name = 'Apache-2.0'
    }
    title = 'Release Demo'
    desc = 'Release Demo for the GPC'
    developers = [
            sbglasius: "Søren Berg Glasius"
    ]
}

asciidoctor {
    resources {
        from('src/docs/images')
        into "./images"
    }
    sources {
        include 'index.adoc'
    }
    attributes 'experimental': 'true',
            'compat-mode': 'true',
            'toc': 'left',
            'icons': 'font',
            'version': project.version,
            'sourcedir': 'src/main/groovy'
    baseDirFollowsSourceDir()
    outputDir = "${buildDir}/asciidoc"
}

tasks.register('apiDocs', Copy) {
    from groovydoc.outputs.files
    into file("${buildDir}/asciidoc/api")
}

asciidoctor.dependsOn(apiDocs)
