  notify-slack:
    name: Notify Slack
    needs: release
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Slack payload
        id: prepare
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          echo "# :rocket: *\(${{ github.repository }})*, just released *\(${{ github.event.release.tag_name }})*\n\n" > body.txt
          
          # Save release notes safely
          if [ -n "$RELEASE_BODY" ]; then
            printf "%s" "$RELEASE_BODY" >> body.txt
          else
            echo "No release notes provided." >> body.txt
          fi
          echo 'Body:'
          cat body.txt 
          echo '-------------'
          # Clean carriage returns
          CLEANED_BODY="$(tr -d '\r' < body.txt)"
          
          # Expose as multiline-safe output variable
          echo 'Cleaned body:'
          echo "$CLEANED_BODY"
          echo '-------------'
          
          echo "body=$CLEANED_BODY" >> "$GITHUB_OUTPUT"
      - run: echo "${{ steps.prepared.outputs.body }}"
      - name: Convert release message to Slack mrkdwn
        id: slackify
        uses: LoveToKnow/slackify-markdown-action@v1.1.1
        with: 
          text: ${{ steps.prepare.outputs.body }}
      - run: echo "${{ steps.slackify.outputs.text }}"
